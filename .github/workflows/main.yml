name: Haye Automatic Setup Sync and APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Haye Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Haye Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install Android SDK
        run: |
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Check Project Files
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

      - name: Verify Gradle
        run: gradle --version

      - name: Validate Android Project
        run: gradle --no-daemon tasks

      - name: Build Debug APK
        run: |
          gradle --no-daemon clean :app:assembleDebug --stacktrace

      - name: Verify APK
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          ls -lh "$APK"

      - name: Upload Haye APK
        uses: actions/upload-artifact@v4
        with:
          name: Haye-Mesh-Chat-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Build Error Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Haye-Build-Error-Reports
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore
          retention-days: 7
