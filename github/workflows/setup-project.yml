name: Haye Automatic Setup Sync and APK Build

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup-build:
    runs-on: ubuntu-latest

    steps:
      # 1. Download project
      - name: Checkout Haye Repository
        uses: actions/checkout@v4

      # 2. Java setup
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK setup
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 4. Install Android SDK
      - name: Install Android SDK Packages
        run: |
          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # 5. Install Gradle
      - name: Install Gradle 8.13
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q gradle-8.13-bin.zip -d "$HOME"
          echo "$HOME/gradle-8.13/bin" >> "$GITHUB_PATH"

      # 6. Check project files
      - name: Verify Android Project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/src/main/AndroidManifest.xml

          echo "Android project structure verified."

      # 7. Generate Native Java Dashboard
      - name: Generate Haye Touch Interface
        run: |
          mkdir -p app/src/main/java/com/offlinemesh/chat

          cat > app/src/main/java/com/offlinemesh/chat/MeshDashboardActivity.java <<'JAVA'
          package com.offlinemesh.chat;

          import android.app.Activity;
          import android.os.Bundle;
          import android.content.Intent;
          import android.graphics.Color;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.*;
          import android.net.Uri;

          public class MeshDashboardActivity extends Activity {

              LinearLayout root;
              LinearLayout messages;
              EditText input;
              TextView status;

              final int green = Color.rgb(7, 94, 84);

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  ScrollView scroll = new ScrollView(this);

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setPadding(16, 16, 16, 16);
                  root.setBackgroundColor(Color.rgb(240, 242, 245));

                  scroll.addView(root);
                  setContentView(scroll);

                  TextView header = new TextView(this);
                  header.setText("HAYE MESH CHAT");
                  header.setTextSize(24);
                  header.setTextColor(Color.WHITE);
                  header.setGravity(Gravity.CENTER);
                  header.setPadding(10, 25, 10, 25);
                  header.setBackgroundColor(green);

                  root.addView(header);

                  status = new TextView(this);
                  status.setText("Status: Ready");
                  status.setTextSize(16);
                  status.setPadding(10, 20, 10, 20);
                  root.addView(status);

                  addButton("Connect Device", v -> {
                      Intent intent = new Intent(
                          android.provider.Settings.ACTION_WIFI_SETTINGS
                      );
                      startActivity(intent);
                  });

                  addButton("Chat", v -> {
                      status.setText("Chat screen selected");
                  });

                  messages = new LinearLayout(this);
                  messages.setOrientation(LinearLayout.VERTICAL);
                  root.addView(messages);

                  input = new EditText(this);
                  input.setHint("Write your message...");
                  root.addView(input);

                  addButton("Send Message", v -> {
                      String text = input.getText().toString().trim();

                      if (!text.isEmpty()) {
                          TextView message = new TextView(this);
                          message.setText("You: " + text);
                          message.setTextSize(16);
                          message.setPadding(12, 12, 12, 12);

                          messages.addView(message);
                          input.setText("");
                      }
                  });

                  addButton("Share Photo", v -> {
                      Intent intent = new Intent(Intent.ACTION_GET_CONTENT);
                      intent.setType("image/*");
                      startActivityForResult(intent, 100);
                  });

                  addButton("Voice Message", v -> {
                      status.setText(
                          "Voice Message: VoiceMessageManager integration required"
                      );
                  });

                  addButton("Audio Call", v -> {
                      status.setText(
                          "Audio Call: WebRTC integration required"
                      );
                  });

                  addButton("Video Call", v -> {
                      status.setText(
                          "Video Call: WebRTC integration required"
                      );
                  });

                  addButton("End Call", v -> {
                      status.setText("Call ended");
                  });

                  addButton("Mesh Network", v -> {
                      status.setText(
                          "Mesh Network: P2PMeshNode integration required"
                      );
                  });
              }

              private void addButton(
                  String title,
                  View.OnClickListener listener
              ) {
                  Button button = new Button(this);

                  button.setText(title);
                  button.setTextSize(16);
                  button.setAllCaps(false);
                  button.setTextColor(Color.WHITE);
                  button.setBackgroundTintList(
                      android.content.res.ColorStateList.valueOf(green)
                  );

                  LinearLayout.LayoutParams params =
                      new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      );

                  params.setMargins(0, 6, 0, 6);

                  root.addView(button, params);
                  button.setOnClickListener(listener);
              }

              @Override
              protected void onActivityResult(
                  int requestCode,
                  int resultCode,
                  Intent data
              ) {
                  super.onActivityResult(requestCode, resultCode, data);

                  if (requestCode == 100 &&
                      resultCode == RESULT_OK &&
                      data != null) {

                      Uri photo = data.getData();
                      status.setText("Photo selected: " + photo);
                  }
              }
          }
          JAVA

      # 8. Register Dashboard as launcher
      - name: Configure Android Manifest
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET

          path = "app/src/main/AndroidManifest.xml"
          tree = ET.parse(path)
          root = tree.getroot()

          android = "{http://schemas.android.com/apk/res/android}"
          app = root.find("application")

          if app is None:
              raise SystemExit("AndroidManifest application missing")

          dashboard = "com.offlinemesh.chat.MeshDashboardActivity"

          # Keep existing activities, but move launcher intent
          for activity in app.findall("activity"):
              for intent in list(activity.findall("intent-filter")):
                  actions = [
                      x.get(android + "name")
                      for x in intent.findall("action")
                  ]
                  categories = [
                      x.get(android + "name")
                      for x in intent.findall("category")
                  ]

                  if (
                      "android.intent.action.MAIN" in actions
                      and "android.intent.category.LAUNCHER" in categories
                  ):
                      activity.remove(intent)

          activity = None

          for item in app.findall("activity"):
              if item.get(android + "name") == dashboard:
                  activity = item
                  break

          if activity is None:
              activity = ET.SubElement(app, "activity")

          activity.set(android + "name", dashboard)
          activity.set(android + "exported", "true")

          intent = ET.SubElement(activity, "intent-filter")

          action = ET.SubElement(intent, "action")
          action.set(
              android + "name",
              "android.intent.action.MAIN"
          )

          category = ET.SubElement(intent, "category")
          category.set(
              android + "name",
              "android.intent.category.LAUNCHER"
          )

          ET.indent(tree, space="    ")
          tree.write(
              path,
              encoding="utf-8",
              xml_declaration=True
          )

          print("Dashboard registered successfully.")
          PY

      # 9. Gradle dependency sync
      - name: Gradle SDK and WebRTC Dependency Sync
        run: |
          gradle --version

          gradle \
            --no-daemon \
            --refresh-dependencies \
            :app:dependencies

      # 10. Compile Java
      - name: Compile Android Java
        run: |
          gradle \
            --no-daemon \
            :app:compileDebugJavaWithJavac

      # 11. Build APK
      - name: Build Debug APK
        run: |
          gradle \
            --no-daemon \
            clean \
            :app:assembleDebug

      # 12. Run unit tests
      - name: Run Android Unit Tests
        run: |
          gradle \
            --no-daemon \
            :app:testDebugUnitTest

      # 13. Commit generated files
      - name: Save Generated Java and Manifest
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            app/src/main/java/com/offlinemesh/chat/MeshDashboardActivity.java \
            app/src/main/AndroidManifest.xml

          if ! git diff --cached --quiet; then
            git commit -m "Generate Haye native touch interface"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      # 14. Upload APK
      - name: Upload Haye APK
        uses: actions/upload-artifact@v4
        with:
          name: Haye-Mesh-Chat-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      # 15. Upload error reports
      - name: Upload Build Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Haye-Build-Error-Reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
